{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Employee Management</h2>

<div class="card mb-4">
    <div class="card-body">

        <h5 id="employeeFormTitle">Add Employee</h5>

        <form id="employeeForm">

            <input type="hidden" id="employeeId">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Employee Code</label>
                    <input id="employee_code"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>First Name</label>
                    <input id="first_name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Last Name</label>
                    <input id="last_name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Email</label>
                    <input type="email"
                           id="email"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Phone</label>
                    <input id="phone"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Department</label>
                    <input id="department"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Designation</label>
                    <input id="designation"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>DOJ</label>
                    <input type="date"
                           id="joining_date"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Status</label>

                    <select id="status"
                            class="form-control">

                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="On Leave">On Leave</option>

                    </select>
                </div>

            </div>

            <button class="btn btn-success">
                Save
            </button>

            <button type="button"
                    class="btn btn-secondary"
                    onclick="resetEmployeeForm()">
                Clear
            </button>

        </form>

    </div>
</div>


<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Department</th>
            <th>Designation</th>
            <th>DOJ</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

    </thead>

    <tbody id="employeeTable"></tbody>

</table>


<script>

async function loadEmployees() {

    const employees =
        await apiRequest('/api/employees/');

    const table =
        document.getElementById('employeeTable');

    table.innerHTML = '';

    employees.forEach(employee => {

        table.innerHTML += `
            <tr>

                <td>${employee.employee_code}</td>

                <td>
                    ${employee.first_name}
                    ${employee.last_name}
                </td>

                <td>${employee.department}</td>

                <td>${employee.designation}</td>

                <td>${employee.joining_date}</td>

                <td>${employee.status}</td>

                <td>

                    <button
                        class="btn btn-sm btn-warning"
                        onclick='editEmployee(${JSON.stringify(employee)})'>
                        Edit
                    </button>

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="deleteEmployee(${employee.id})">
                        Delete
                    </button>

                </td>

            </tr>
        `;
    });
}


document.getElementById('employeeForm')
.addEventListener('submit', async function(event) {

    event.preventDefault();

    const id =
        document.getElementById('employeeId').value;

    const data = {

        employee_code:
            document.getElementById('employee_code').value,

        first_name:
            document.getElementById('first_name').value,

        last_name:
            document.getElementById('last_name').value,

        email:
            document.getElementById('email').value,

        phone:
            document.getElementById('phone').value,

        department:
            document.getElementById('department').value,

        designation:
            document.getElementById('designation').value,

        joining_date:
            document.getElementById('joining_date').value,

        status:
            document.getElementById('status').value
    };


    try {

        if (id) {

            await apiRequest(
                `/api/employees/${id}/`,
                {
                    method: 'PATCH',
                    body: JSON.stringify(data)
                }
            );

        } else {

            await apiRequest(
                '/api/employees/',
                {
                    method: 'POST',
                    body: JSON.stringify(data)
                }
            );
        }

        resetEmployeeForm();

        await loadEmployees();

        alert('Employee saved successfully.');

    } catch (error) {

        console.error(error);

        alert('Error saving employee.');

    }

});


function editEmployee(employee) {

    document.getElementById('employeeId').value =
        employee.id;

    document.getElementById('employee_code').value =
        employee.employee_code;

    document.getElementById('first_name').value =
        employee.first_name;

    document.getElementById('last_name').value =
        employee.last_name;

    document.getElementById('email').value =
        employee.email;

    document.getElementById('phone').value =
        employee.phone;

    document.getElementById('department').value =
        employee.department;

    document.getElementById('designation').value =
        employee.designation;

    document.getElementById('joining_date').value =
        employee.joining_date;

    document.getElementById('status').value =
        employee.status;

    document.getElementById('employeeFormTitle')
        .innerText = 'Edit Employee';

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


async function deleteEmployee(id) {

    if (!confirm(
        'Are you sure you want to delete this employee?'
    )) {
        return;
    }

    try {

        await apiRequest(
            `/api/employees/${id}/`,
            {
                method: 'DELETE'
            }
        );

        await loadEmployees();

        alert('Employee deleted successfully.');

    } catch (error) {

        console.error(error);

        alert('Error deleting employee.');

    }
}


function resetEmployeeForm() {

    document.getElementById('employeeForm').reset();

    document.getElementById('employeeId').value = '';

    document.getElementById('employeeFormTitle')
        .innerText = 'Add Employee';
}


loadEmployees();

</script>

{% endblock %}
