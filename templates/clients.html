{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Client Management</h2>

<div class="card mb-4">
    <div class="card-body">

        <h5 id="clientFormTitle">Add Client</h5>

        <form id="clientForm">

            <input type="hidden" id="clientId">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Client Code</label>
                    <input id="client_code"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Company Name</label>
                    <input id="company_name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Contact Person</label>
                    <input id="contact_person"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Email</label>
                    <input type="email"
                           id="email"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Phone</label>
                    <input id="phone"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Industry</label>
                    <input id="industry"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">

                    <label>Status</label>

                    <select id="status"
                            class="form-control">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>

            <button class="btn btn-success">
                Save
            </button>

            <button type="button"
                    class="btn btn-secondary"
                    onclick="resetClientForm()">
                Clear
            </button>

        </form>

    </div>
</div>


<table class="table table-bordered table-hover">

    <thead class="table-dark">

        <tr>
            <th>Code</th>
            <th>Company</th>
            <th>Contact</th>
            <th>Industry</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

    </thead>

    <tbody id="clientTable"></tbody>

</table>


<script>

async function loadClients() {

    const clients =
        await apiRequest('/api/clients/');

    const table =
        document.getElementById('clientTable');

    table.innerHTML = '';

    clients.forEach(client => {

        table.innerHTML += `
            <tr>

                <td>${client.client_code}</td>

                <td>${client.company_name}</td>

                <td>${client.contact_person}</td>

                <td>${client.industry}</td>

                <td>${client.status}</td>

                <td>

                    <button
                        class="btn btn-sm btn-warning"
                        onclick='editClient(${JSON.stringify(client)})'>
                        Edit
                    </button>

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="deleteClient(${client.id})">
                        Delete
                    </button>

                </td>

            </tr>
        `;
    });
}


document.getElementById('clientForm')
.addEventListener('submit', async function(event) {

    event.preventDefault();

    const id =
        document.getElementById('clientId').value;

    const data = {

        client_code:
            document.getElementById('client_code').value,

        company_name:
            document.getElementById('company_name').value,

        contact_person:
            document.getElementById('contact_person').value,

        email:
            document.getElementById('email').value,

        phone:
            document.getElementById('phone').value,

        industry:
            document.getElementById('industry').value,

        status:
            document.getElementById('status').value
    };


    try {

        await apiRequest(
            id
                ? `/api/clients/${id}/`
                : '/api/clients/',
            {
                method: id ? 'PATCH' : 'POST',
                body: JSON.stringify(data)
            }
        );

        resetClientForm();

        await loadClients();

        alert('Client saved successfully.');

    } catch (error) {

        console.error(error);

        alert('Error saving client.');

    }
});


function editClient(client) {

    document.getElementById('clientId').value =
        client.id;

    document.getElementById('client_code').value =
        client.client_code;

    document.getElementById('company_name').value =
        client.company_name;

    document.getElementById('contact_person').value =
        client.contact_person;

    document.getElementById('email').value =
        client.email;

    document.getElementById('phone').value =
        client.phone;

    document.getElementById('industry').value =
        client.industry;

    document.getElementById('status').value =
        client.status;

    document.getElementById('clientFormTitle')
        .innerText = 'Edit Client';

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


async function deleteClient(id) {

    if (!confirm(
        'Are you sure you want to delete this client?'
    )) {
        return;
    }

    try {

        await apiRequest(
            `/api/clients/${id}/`,
            {
                method: 'DELETE'
            }
        );

        await loadClients();

        alert('Client deleted successfully.');

    } catch (error) {

        console.error(error);

        alert('Error deleting client.');

    }
}


function resetClientForm() {

    document.getElementById('clientForm').reset();

    document.getElementById('clientId').value = '';

    document.getElementById('clientFormTitle')
        .innerText = 'Add Client';
}


loadClients();

</script>

{% endblock %}
